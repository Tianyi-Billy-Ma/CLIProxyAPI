# Fork-only: weekly merge of upstream router-for-me/CLIProxyAPI main into main.
# Never force-pushes. On a merge conflict, failing tests or a rejected push it
# opens (or comments on) an issue labelled upstream-sync and leaves main alone.
# Pushing upstream workflow changes needs a token with the workflow scope:
# set secret SYNC_TOKEN (fine-grained PAT, contents + workflows write) for that.
name: fork-upstream-sync

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: fork-upstream-sync

jobs:
  sync:
    if: github.repository == 'Tianyi-Billy-Ma/CLIProxyAPI'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch --tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            echo "result=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' upstream/main)"
          echo "$version" > .github/fork/upstream-version
          git add .github/fork/upstream-version
          git commit --amend --no-edit
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "result=merged" >> "$GITHUB_OUTPUT"
      - name: Test merged tree
        id: test
        if: steps.merge.outputs.result == 'merged'
        run: |
          go build -o /tmp/cli-proxy-api ./cmd/server
          if ! go test ./... > /tmp/test.log 2>&1; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push
        id: push
        env:
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' && 'yes' || '' }}
        if: steps.merge.outputs.result == 'merged' && steps.test.outputs.failed != 'true'
        run: |
          if git push origin HEAD:main; then
            # A push made with GITHUB_TOKEN does not fire the image workflow's push trigger.
            if [ -z "${HAS_SYNC_TOKEN}" ]; then gh workflow run fork-image.yml --ref main; fi
          else
            echo "rejected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report problem
        if: steps.merge.outputs.result == 'conflict' || steps.test.outputs.failed == 'true' || steps.push.outputs.rejected == 'true'
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Upstream sync could not land on main ($(date -u +%Y-%m-%d)). Run: ${run_url}"
            echo
            if [ "${{ steps.merge.outputs.result }}" = conflict ]; then
              echo "Merge conflict in:"; echo '```'; cat /tmp/conflicts.txt; echo '```'
            elif [ "${{ steps.test.outputs.failed }}" = true ]; then
              echo "Merged tree fails tests (last lines):"; echo '```'; tail -60 /tmp/test.log; echo '```'
            else
              echo "Push to main was rejected (upstream may have changed workflow files; set SYNC_TOKEN with workflows write)."
            fi
            echo
            echo "Resolve locally: git fetch https://github.com/router-for-me/CLIProxyAPI.git main && git merge FETCH_HEAD, then push without force."
          } > /tmp/issue.md
          gh label create upstream-sync --color D93F0B --force >/dev/null 2>&1 || true
          existing="$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue.md
          else
            gh issue create --title "Upstream sync needs attention" --label upstream-sync --body-file /tmp/issue.md
          fi
