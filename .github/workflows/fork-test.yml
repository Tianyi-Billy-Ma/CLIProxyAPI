# Fork-only: build and test on pull requests (and before every image build).
# Upstream's full suite has known failures of its own, so it is informational;
# the packages this fork touches must pass.
name: fork-test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'Tianyi-Billy-Ma/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o /tmp/cli-proxy-api ./cmd/server
      - name: Test fork packages
        run: bash .github/fork/test.sh
      - name: Full upstream suite (informational)
        continue-on-error: true
        run: go test ./...
