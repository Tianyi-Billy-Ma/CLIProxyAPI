# Fork-only: build the linux/arm64 image and push it to GHCR.
# Tags: <upstream version>-asr.<run number>, sha-<short sha>, latest.
name: fork-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image

env:
  IMAGE: ghcr.io/tianyi-billy-ma/cli-proxy-api

jobs:
  test:
    uses: ./.github/workflows/fork-test.yml

  image:
    needs: test
    if: github.repository == 'Tianyi-Billy-Ma/CLIProxyAPI'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build metadata
        run: |
          upstream="$(tr -d '[:space:]' < .github/fork/upstream-version)"
          echo "VERSION=${upstream}-asr.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # Only main may move :latest; other refs get immutable tags only.
          if [ "${GITHUB_REF}" = refs/heads/main ]; then
            echo "LATEST_TAG=${IMAGE}:latest" >> "$GITHUB_ENV"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ env.COMMIT }}
            ${{ env.LATEST_TAG }}
      - run: echo "Pushed ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
